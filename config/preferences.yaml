llm:
  provider: lmstudio
  base_url: http://localhost:1234/v1
  api_key: lm-studio
  chat_model: google/gemma-4-12b-qat
  embedding_model: null
  request_timeout: 120.0
  max_retries: 3
  temperature: 0.2
browser:
  # Chrome via Playwright. 'channel: chrome' launches the locally installed
  # Google Chrome; remove 'channel' to fall back to Playwright's bundled
  # Chromium. persistent_profile keeps cookies/logins under
  # data/browser_profiles/<profile>, so sign in once and it persists.
  engine: chromium
  channel: chrome
  persistent_profile: true
  profile_source: managed
  firefox_profile: null
  headless: false
  slowmo_ms: 50
  profile: default
  reuse_existing_session: true
  clone_system_profile_on_lock: true
  locale: en-US
  user_agent: null
  timeout_ms: 30000
  viewport_width: 1366
  viewport_height: 900
apply:
  default_mode: human_review
  allow_auto_submit: false
  daily_limit: 30
  require_min_score: 0.6
  confirm_before_submit: true
scoring:
  weights:
    skill_overlap: 0.4
    seniority_alignment: 0.2
    salary_fit: 0.1
    location_compatibility: 0.15
    fit_score: 0.15
automation:
  max_concurrent_sessions: 3
  cooldown_seconds: 120
  default_interval_minutes: 90
seniority: null
locations:
- Austin, TX
- Dallas, TX
- Richardson, TX
- Remote (US)
- Anywhere
role_keywords:
- software engineer
- software developer
- frontend engineer
- frontend developer
- backend engineer
- backend developer
- full stack engineer
- full stack developer
- fullstack
- ai engineer
- ai developer
- machine learning engineer
- ml engineer
- artificial intelligence
- web developer
- python developer
- react developer
- distributed systems
- cloud engineer
- platform engineer
- devops
- intern
- internship
- software engineer intern
- software developer intern
- co-op
excluded_keywords:
- unpaid
- commission only
- citizenship required
- security clearance required
- u.s. citizen
- us citizen
excluded_titles:
- staff augmentation
- contractor only
preferred_industries: []
target_companies: []
salary_expectations:
  min: 25
  max: 30
  currency: USD
  period: hour
remote_preference: no_preference
