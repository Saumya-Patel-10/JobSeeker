[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseeker"
version = "1.1.0"
description = "AI-powered job discovery and application platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Saumya Patel" }]
keywords = ["jobs", "automation", "ai", "playwright", "local-llm", "jobseeker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Operating System :: OS Independent",
]

dependencies = [
    # Web + API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    # Automation
    "playwright>=1.46",
    # HTTP + resilience
    "httpx>=0.27",
    "tenacity>=8.5",
    # CLI + console
    "typer>=0.12",
    "rich>=13.7",
    # Logging
    "structlog>=24.4",
    "python-json-logger>=2.0",
    # Config + templating
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    # Vector store
    "chromadb>=0.5",
    # Document generation
    "python-docx>=1.1",
    "reportlab>=4.2",
    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "selectolax>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12",
]
embeddings = [
    # Optional high-quality embeddings. ChromaDB ships an ONNX MiniLM default
    # so this is only needed if you want a different sentence-transformers model.
    "sentence-transformers>=3.0",
]

[project.scripts]
jobassist = "app.cli.main:app"
jobseeker = "app.cli.main:app"

[project.urls]
Homepage = "https://github.com/local/jobassist"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.j2"]
"app.resume.templates" = ["*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "ASYNC",
    "C4",  # comprehensions
    "T20", # print statements
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",     # line length handled by black
    "B008",     # function calls in default arg (Typer/FastAPI pattern)
    "ASYNC240", # pathlib.Path in async is fine for local fast I/O
    "RUF001",   # en-dash glyphs in resume date ranges are intentional typography
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20"]
"app/cli/**/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["build/", "dist/", "data/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "selectolax.*",
    "reportlab.*",
    "docx.*",
    "playwright.*",
    "python_docx.*",
    "pythonjsonlogger.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests with no network",
    "network: tests requiring network (skipped by default)",
]
